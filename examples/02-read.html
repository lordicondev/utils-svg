    <body>
        <p><a href="/">Examples</a></p>
        <h1>Read and unpack</h1>
        <p>
            <code>readPack()</code> tells what a pack holds; <code>unpackSvg()</code> gives its
            layers back, each an SVG of its own, optimised and with ids of its own.
            <code>isPack()</code> tells a pack from a plain SVG.
